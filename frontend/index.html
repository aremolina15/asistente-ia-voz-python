<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente DevOps por Voz</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      max-width: 900px;
      margin-inline: auto;
      line-height: 1.4;
    }
    h1 { margin-bottom: 8px; }
    .hint { opacity: 0.8; margin-bottom: 20px; }
    .card {
      border: 1px solid #9993;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      background: #8881;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      cursor: pointer;
    }
    .primary { background: #2563eb; color: white; }
    .danger { background: #dc2626; color: white; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .status { font-weight: 600; }
    .muted { opacity: 0.75; }
    textarea {
      width: 100%;
      min-height: 100px;
      border-radius: 8px;
      border: 1px solid #9994;
      padding: 10px;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
    }
    ul { margin: 8px 0 0 18px; }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <h1>Asistente DevOps por Voz</h1>
  <p class="hint">Habla por micrófono, el sistema transcribe, consulta IA/RAG y reproduce la respuesta en audio.</p>

  <div class="card">
    <div class="row">
      <button id="startBtn" class="primary">🎤 Iniciar grabación</button>
      <button id="stopBtn" class="danger" disabled>⏹️ Detener</button>
      <span id="status" class="status">Estado: listo</span>
    </div>
    <p class="muted">Idioma: <code id="langLabel">es-CO</code></p>
  </div>

  <div class="card">
    <h3>Transcripción</h3>
    <textarea id="transcript" placeholder="Aquí aparecerá la transcripción..." readonly></textarea>
  </div>

  <div class="card">
    <h3>Respuesta del asistente</h3>
    <textarea id="response" placeholder="Aquí aparecerá la respuesta..." readonly></textarea>
    <div>
      <strong>Fuentes RAG:</strong>
      <ul id="sources"></ul>
    </div>
    <audio id="audioPlayer" controls style="width:100%; margin-top:10px;"></audio>
  </div>

  <script>
    const API_BASE = `${window.location.origin}/api/v1/voice`;
    const LANGUAGE_CODE = "es-CO";

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const statusEl = document.getElementById("status");
    const transcriptEl = document.getElementById("transcript");
    const responseEl = document.getElementById("response");
    const audioPlayer = document.getElementById("audioPlayer");
    const sourcesEl = document.getElementById("sources");
    const langLabel = document.getElementById("langLabel");

    langLabel.textContent = LANGUAGE_CODE;

    let mediaRecorder = null;
    let mediaStream = null;
    let chunks = [];
    let currentMime = "";

    function setStatus(text) {
      statusEl.textContent = `Estado: ${text}`;
    }

    function clearSources() {
      sourcesEl.innerHTML = "";
    }

    function renderSources(sources = []) {
      clearSources();
      if (!sources.length) {
        const li = document.createElement("li");
        li.textContent = "Sin fuentes (modo no RAG o sin recuperación).";
        sourcesEl.appendChild(li);
        return;
      }

      sources.forEach((src) => {
        const li = document.createElement("li");
        li.textContent = src;
        sourcesEl.appendChild(li);
      });
    }

    function pickSupportedMime() {
      const candidates = [
        "audio/webm;codecs=opus",
        "audio/ogg;codecs=opus",
        "audio/webm",
        "audio/ogg",
      ];
      return candidates.find((m) => MediaRecorder.isTypeSupported(m)) || "";
    }

    async function startRecording() {
      try {
        setStatus("solicitando permiso de micrófono...");
        currentMime = pickSupportedMime();

        mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = currentMime ? new MediaRecorder(mediaStream, { mimeType: currentMime }) : new MediaRecorder(mediaStream);
        chunks = [];

        mediaRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) chunks.push(event.data);
        };

        mediaRecorder.onstop = processAudio;

        mediaRecorder.start();
        startBtn.disabled = true;
        stopBtn.disabled = false;
        transcriptEl.value = "";
        responseEl.value = "";
        clearSources();
        setStatus("grabando...");
      } catch (error) {
        setStatus("error de micrófono");
        alert(`No se pudo acceder al micrófono: ${error.message}`);
      }
    }

    function stopRecording() {
      if (!mediaRecorder) return;
      mediaRecorder.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus("procesando audio...");

      if (mediaStream) {
        mediaStream.getTracks().forEach((track) => track.stop());
      }
    }

    function extensionFromMime(mime) {
      if (mime.includes("ogg")) return "ogg";
      if (mime.includes("webm")) return "webm";
      return "wav";
    }

    async function transcribeAudio(blob, ext) {
      const formData = new FormData();
      formData.append("file", blob, `voice.${ext}`);
      formData.append("language_code", LANGUAGE_CODE);

      const res = await fetch(`${API_BASE}/transcribe`, {
        method: "POST",
        body: formData,
      });

      if (!res.ok) {
        const msg = await res.text();
        throw new Error(`Error transcripción (${res.status}): ${msg}`);
      }

      return res.json();
    }

    async function queryAssistant(query) {
      const res = await fetch(`${API_BASE}/query`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query, language_code: LANGUAGE_CODE }),
      });

      if (!res.ok) {
        const msg = await res.text();
        throw new Error(`Error consulta (${res.status}): ${msg}`);
      }

      return res.json();
    }

    async function processAudio() {
      try {
        if (!chunks.length) {
          setStatus("sin audio capturado");
          return;
        }

        const mime = currentMime || chunks[0].type || "audio/webm";
        const blob = new Blob(chunks, { type: mime });
        const ext = extensionFromMime(mime);

        setStatus("transcribiendo...");
        const transcription = await transcribeAudio(blob, ext);
        const transcript = transcription.transcript || "";
        transcriptEl.value = transcript;

        if (!transcript.trim()) {
          setStatus("no se detectó texto útil");
          return;
        }

        setStatus("consultando asistente...");
        const result = await queryAssistant(transcript);

        responseEl.value = result.response || "";
        renderSources(result.sources || []);

        if (result.audio_base64) {
          audioPlayer.src = `data:audio/mp3;base64,${result.audio_base64}`;
          await audioPlayer.play().catch(() => {});
        }

        setStatus("listo");
      } catch (error) {
        setStatus("error");
        alert(error.message || "Error procesando audio");
      }
    }

    startBtn.addEventListener("click", startRecording);
    stopBtn.addEventListener("click", stopRecording);
  </script>
</body>
</html>
